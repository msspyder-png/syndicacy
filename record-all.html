        <div class="roster-header" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; margin-top: 20px;">
            <div>
                <h2 class="title" style="font-size: 20px; margin: 0;">Complete Team Ledger</h2>

                        <th style="padding: 12px 15px; color: #888; font-weight: 600; width: 20%;">Avg Check-in</th>
                        <th style="padding: 12px 15px; color: #888; font-weight: 600; width: 15%;">Attend %</th>
                        <th style="padding: 12px 15px; color: #888; font-weight: 600; text-align: right; width: 15%;">Status</th>
                    </tr>
                </thead>
                <tbody id="ledger-table-body">
                    <tr>
                        <td colspan="5" style="padding: 20px; text-align: center; color: #888;">Loading ledger data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
