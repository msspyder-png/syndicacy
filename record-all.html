<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Team Ledger - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-content">
        <div style="text-align: left; margin-top: 10px; margin-bottom: 20px;">
            <a href="leader-dashboard.html" style="color: #888; text-decoration: none; font-size: 14px;">← Back to Overview</a>
        </div>

        <div class="roster-header" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
            <div>
                <h2 class="title" style="font-size: 20px; margin: 0;">Complete Team Ledger</h2>
                <p style="font-size: 12px; color: #888; margin: 4px 0 0 0;">Master attendance overview</p>
            </div>
        </div>

        <!-- THE SPREADSHEET GRID -->
        <div class="form-card" style="padding: 0; overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; white-space: nowrap;">
                <thead>
                    <tr style="background-color: #f9f9f9; border-bottom: 2px solid #eaeaea;">
                        <th style="padding: 12px 15px; color: #888; font-weight: 600;">Name</th>
                        <th style="padding: 12px 15px; color: #888; font-weight: 600;">Role</th>
                        <th style="padding: 12px 15px; color: #888; font-weight: 600;">Status</th>
                        <th style="padding: 12px 15px; color: #888; font-weight: 600;">Attend %</th>
                    </tr>
                </thead>
                <tbody id="ledger-table-body">
                    <tr>
                        <td colspan="4" style="padding: 20px; text-align: center; color: #888;">Loading ledger data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js?v=1006"></script>
</body>
</html>
