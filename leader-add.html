<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-content">
        <div class="dash-header">
            <h2 class="title" style="font-size: 24px; margin-top: 20px;">Onboard Staff</h2>
            <p class="subtitle">Invite new members to your organization</p>
        </div>

        <div class="form-card">
            <h3 class="section-title">New Invitation</h3>
            
            <div class="input-group">
                <input type="text" id="staff-name" class="input-field" placeholder="Full Name">
            </div>

            <div class="input-group">
                <input type="email" id="staff-email" class="input-field" placeholder="Email Address">
            </div>

            <div class="input-group">
                <select id="staff-role" class="input-field select-field" onchange="toggleCustomRole()">
                    <option value="" disabled selected>Select Designation / Role</option>
                    <option value="Student">Student</option>
                    <option value="HR">HR Manager</option>
                    <option value="Team Lead">Team Lead</option>
                    <option value="other">Other...</option>
                </select>
            </div>

            <div class="input-group" id="custom-role-container" style="display: none;">
                <input type="text" id="custom-role" class="input-field" placeholder="Specify Custom Role">
            </div>

            <div class="button-stack">
                <button class="main-btn form-btn" onclick="sendInviteLink()">Send Direct Invite</button>
                <button class="google-btn" onclick="copyInviteLink()">Copy Invite Link</button>
            </div>
        </div>

        <div class="directory-section" style="margin-bottom: 30px;">
            <h3 class="section-title" style="color: #f59e0b;">Pending Approvals</h3>
            
            <div class="directory-list" id="pending-list">
                <p style="font-size: 12px; color: #888;">Fetching requests from cloud...</p>
            </div>
        </div>

        <div class="directory-section">
            <h3 class="section-title">Team Directory</h3>
            
            <input type="text" id="staff-search" class="input-field search-input" placeholder="Search by name or role..." onkeyup="filterDirectory()">

            <div class="directory-list" id="directory-list">
                <div class="directory-card">
                    <div class="avatar">SJ</div>
                    <div class="staff-info">
                        <span class="staff-name">Steve Jobs</span>
                        <span class="staff-role">HR Manager</span>
                    </div>
                </div>

                <div class="directory-card">
                    <div class="avatar">EM</div>
                    <div class="staff-info">
                        <span class="staff-name">Elon Musk</span>
                        <span class="staff-role">Team Lead</span>
                    </div>
                </div>

                <div class="directory-card">
                    <div class="avatar">BG</div>
                    <div class="staff-info">
                        <span class="staff-name">Bill Gates</span>
                        <span class="staff-role">Student</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="leader-dashboard.html" class="nav-item">

            <span>Overview</span>
        </a>
        <a href="leader-today.html" class="nav-item">

            </svg>
            <span>Codes</span>
        </a>
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Add</span>
        </a>
        <a href="leader-dashboard.html" class="nav-item" onclick="openRecordsModal(); return false;">
