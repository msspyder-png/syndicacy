<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-content" style="padding-bottom: 90px;">
        <div class="dash-header">
            <h2 class="title" style="font-size: 24px; margin-top: 20px;">Onboard Staff</h2>
            <p class="subtitle">Invite new members to your organization</p>
        </div>

        <div class="form-card">
            <h3 class="section-title">New Invitation</h3>
            
            <div class="input-group">
                <input type="text" id="staff-name" class="input-field" placeholder="Full Name">
            </div>

            <div class="input-group">
                <input type="email" id="staff-email" class="input-field" placeholder="Email Address">
            </div>

            <div class="input-group">
                <select id="staff-role" class="input-field select-field" onchange="toggleCustomRole()">
                    <option value="" disabled selected>Select Designation / Role</option>
                    <option value="Software Engineer">Software Engineer</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="HR Professional">HR Professional</option>
                    <option value="Sales Representative">Sales Representative</option>
                    <option value="Marketing Specialist">Marketing Specialist</option>
                    <option value="Accountant / Finance">Accountant / Finance</option>
                    <option value="Customer Support">Customer Support</option>
                    <option value="Administrative Assistant">Administrative Assistant</option>
                    <option value="Team Lead">Team Lead</option>
                    <option value="Contractor">Contractor</option>
                    <option value="Intern">Intern</option>
                    <option value="other">Other...</option>
                </select>
            </div>

            <div class="input-group" id="custom-role-container" style="display: none;">
                <input type="text" id="custom-role" class="input-field" placeholder="Specify Custom Role">
            </div>

            <div class="button-stack">
                <button class="main-btn form-btn" onclick="sendInviteLink()">Send Direct Invite</button>
                <button class="google-btn" onclick="copyInviteLink()">Copy Invite Link</button>
            </div>
        </div>

        <div class="directory-section" style="margin-bottom: 30px;">
            <!-- PENDING APPROVALS SECTION -->
            <h3 class="section-title" style="margin-top: 40px; border-bottom: 1px solid #eaeaea; padding-bottom: 10px;">Pending Approvals</h3>
            
            <!-- JavaScript will automatically load the real pending invites here -->
            <div id="pending-list"></div>

            <!-- TEAM DIRECTORY SECTION -->
            <h3 class="section-title" style="margin-top: 40px; border-bottom: 1px solid #eaeaea; padding-bottom: 10px;">Team Directory</h3>
            
            <div class="search-bar" style="margin-bottom: 15px; position: relative;">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="#888" stroke-width="2" fill="none" style="position: absolute; left: 12px; top: 12px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="staff-search" class="input-field" placeholder="Search by name or role..." style="padding-left: 35px;" onkeyup="filterDirectory()">
            </div>

            <!-- JavaScript will automatically load the real team members here -->
            <div id="directory-list"></div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="leader-dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Overview</span>
        </a>
        <a href="leader-today.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon">
                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                <path d="M6 10.5l2 3m0-3l-2 3 M10 10.5l2 3m0-3l-2 3 M14 10.5l2 3m0-3l-2 3 M18 10.5l2 3m0-3l-2 3"></path>
            </svg>
            <span>Codes</span>
        </a>
        <a href="leader-add.html" class="nav-item active">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Add</span>
        </a>
        <a href="record-all.html" class="nav-item" style="text-decoration: none; color: #888; text-align: center;">
            <svg viewBox="0 0 24 24" class="nav-icon" style="width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span style="display: block; font-size: 10px; margin-top: 4px;">Records</span>
        </a>
        <a href="leader-settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="script.js?v=999"></script>
</body>
</html>
