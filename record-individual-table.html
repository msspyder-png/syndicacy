<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Log - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">
    <div class="dashboard-content">
        <div style="text-align: left; margin-top: 10px; margin-bottom: 20px;">
            <a href="javascript:window.history.back()" style="color: #888; text-decoration: none; font-size: 14px;">← Back to Analytics</a>
        </div>
        <div class="dash-header" style="text-align: left;">
            <h2 class="title" style="font-size: 24px;" id="dt-name">Loading...</h2>
            <p class="subtitle" style="margin-bottom: 15px;">Complete historical log</p>
        </div>
        <div style="overflow-x: auto;">
            <table class="detailed-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Day</th>
                        <th>Status</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                    </tr>
                </thead>
                <tbody id="dt-body">
                    <tr><td colspan="5" style="text-align:center;">Loading records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        window.onload = async () => {
            await ensureSupabase();
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const { data: user } = await supabaseClient.from('users').select('name').eq('email', email).single();
            document.getElementById('dt-name').innerText = user.name;
            const { data: logs } = await supabaseClient.from('checkins').select('*').eq('user_email', email).order('date', { ascending: false });
            
            const tbody = document.getElementById('dt-body');
            tbody.innerHTML = '';
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            logs.forEach(log => {
                const dateObj = new Date(log.date);
                const dayName = days[dateObj.getDay()];
                let statusHtml = `<span style="color: #4ade80; font-weight:bold;">Present</span>`;
                if (log.status === 'Holiday/Off') statusHtml = `<span style="color: #888; font-weight:bold;">Personal Off</span>`;
                if (log.is_late) statusHtml = `<span style="color: #a855f7; font-weight:bold;">Late Arrival</span>`;
                
                let outStr = log.checkout_time || "<span style='color:#ccc;'>Didn't check out</span>";
                let inStr = log.time === '--:--' ? '-' : log.time;

                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${log.date}</td>
                        <td style="font-weight:bold; color:#1a1a1a;">${dayName}</td>
                        <td>${statusHtml}</td>
                        <td>${inStr}</td>
                        <td>${outStr}</td>
                    </tr>
                `);
            });
        };
    </script>
</body>
</html>
