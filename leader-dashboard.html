<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Dashboard - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-content" style="padding-bottom: 90px;">
        <div class="dash-header">
            <h2 class="title" style="font-size: 24px; margin-top: 20px;">Overview</h2>
            <p class="subtitle">Live attendance tracking</p>
        </div>

        <div class="status-section">
            <h3 class="section-title">Active Today</h3>
            <div class="member-grid" id="active-today-list">
                <div class="member-card present">
                    <div class="avatar">SJ</div>
                    <span class="name">Steve J.</span>
                    <span style="font-size: 9px; color: #888; font-weight: 500; margin-top: 2px;">09:02 AM</span>
                </div>
                <div class="member-card present">
                    <div class="avatar">EM</div>
                    <span class="name">Elon M.</span>
                    <span style="font-size: 9px; color: #888; font-weight: 500; margin-top: 2px;">08:55 AM</span>
                </div>
            </div>
        </div>

        <div class="status-section">
            <h3 class="section-title">Pending Check-ins</h3>
            <div class="member-grid" id="pending-today-list">
                <div class="member-card absent">
                    <div class="avatar">JB</div>
                    <span class="name">Jeff B.</span>
                </div>
            </div>
        </div>
    </div>

    <div id="records-modal" class="modal-bg">
        <div class="modal-box animated-modal">
            <span class="close" onclick="closeRecordsModal()">×</span>
            <h3 class="section-title" style="text-align: center; margin-bottom: 20px;">Generate Report</h3>
            
            <div id="report-options" class="button-stack">
                <button class="main-btn form-btn" onclick="showIndividualList()">Individual Report</button>
                <a href="record-all.html" class="google-btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">Complete Team Ledger</a>
            </div>

            <div id="individual-list" class="name-list" style="display: none;">
                <p style="font-size: 12px; color: #888; margin-top: 0;">Select a member to view records:</p>
                <div class="name-item" onclick="window.location.href='record-individual.html'">Steve Jobs</div>
                <div class="name-item" onclick="window.location.href='record-individual.html'">Elon Musk</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #ffffff;">
        <a href="leader-dashboard.html" class="nav-item active">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Overview</span>
        </a>
        <a href="leader-today.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10.5l2 3m0-3l-2 3 M10 10.5l2 3m0-3l-2 3 M14 10.5l2 3m0-3l-2 3 M18 10.5l2 3m0-3l-2 3"></path></svg>
            <span>Codes</span>
        </a>
        <a href="leader-add.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Add</span>
        </a>
        <a href="javascript:void(0);" class="nav-item" onclick="openRecordsModal();">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>Records</span>
        </a>
        <a href="leader-settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="script.js?v=1009"></script>
</body>
</html>
