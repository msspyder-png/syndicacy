<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Login - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h2 class="title" style="font-size: 24px; margin-bottom: 30px;">Signup / Login</h2>

        <div class="form-container">
            
     <input type="email" id="user-email" class="input-field" placeholder="Enter email">
            
          <input type="password" id="user-pass" class="input-field" placeholder="Create/enter password (min 8 chars)">
            
            <!-- NEW LIABILITY SHIELD CHECKBOX -->
            <div style="width: 260px; text-align: left; margin-top: 10px; margin-bottom: 5px; display: flex; align-items: flex-start; gap: 8px;">
                <input type="checkbox" id="liability-checkbox" style="margin-top: 3px; cursor: pointer; flex-shrink: 0;" onchange="document.getElementById('enter-btn').disabled = !this.checked; document.getElementById('enter-btn').style.opacity = this.checked ? '1' : '0.5';">
                <label for="liability-checkbox" style="font-size: 10px; color: #555; line-height: 1.4; cursor: pointer;">
                    I agree to the Terms of Service and acknowledge my legal responsibility as an Employer to provide alternative, non-biometric timekeeping accommodations for employees who decline facial scanning.
                </label>
            </div>
            
            <button id="enter-btn" class="main-btn form-btn" onclick="handleLeaderAuth()" style="opacity: 0.5;" disabled>Enter</button>
            
            <!-- NEW FORGOT PASSWORD LINK -->
            <div style="width: 100%; text-align: right; margin-top: -5px; padding-right: 5px; box-sizing: border-box;">
                <a href="#" onclick="requestPasswordReset()" style="font-size: 12px; color: #888; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#1a1a1a'" onmouseout="this.style.color='#888'">Forgot Password?</a>
            </div>
            
            <div class="divider">or</div>
            
            <button class="google-btn">Join with Google</button>
        </div>
    </div>

<script src="script.js?v=6000"></script>
</body>
</html>
