<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Login - SYNDICACY</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h2 class="title" style="font-size: 24px; margin-bottom: 30px;">Signup / Login</h2>

        <div class="form-container">
            
            <input type="email" id="user-email" class="input-field" placeholder="Enter email">
            
            <input type="password" id="user-pass" class="input-field" placeholder="Create/enter password">
            
            <button class="main-btn form-btn" onclick="handleLeaderAuth()">Enter</button>
            
            <div class="divider">or</div>
            
            <button class="google-btn">Join with Google</button>
        </div>
    </div>

    <script src="script.js?v=999"></script>
</body>
</html>
